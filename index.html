<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalizator OSM</title>

    <!-- Biblioteka Leaflet (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Biblioteka MQTT do stabilnego transferu danych -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 10px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #7f8c8d; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        #status { font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

    <div id="controls">
        <label for="roomId">ID Pokoju:</label>
        <input type="text" id="roomId" value="moja-trasa-123">
        
        <button id="btnPhone" onclick="startPhoneMode()">Uruchom jako NADAJNIK (Telefon)</button>
        <button id="btnPC" onclick="startPCMode()">Uruchom jako ODBIORNIK (PC)</button>
        
        <span id="status">Wybierz tryb pracy.</span>
    </div>

    <div id="map"></div>

    <script>
        let map, marker;
        let client;

        // Inicjalizacja mapy OpenStreetMap
        function initMap() {
            map = L.map('map').setView([52.2297, 21.0122], 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
        }

        initMap();

        // Połączenie ze darmowym brokerem MQTT przez WebSockets (Port 8884 - HTTPS)
        function connectMQTT(onSuccess) {
            const status = document.getElementById('status');
            status.innerText = "Łączenie z serwerem...";

            const clientId = 'osm_user_' + Math.random().toString(16).substr(2, 8);
            
            // Publiczny broker MQTT HiveMQ wspierający bezpieczny WebSocket
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: clientId,
                keepalive: 30
            });

            client.on('connect', () => {
                status.innerText = "Połączono ze stabilnym serwerem!";
                if (onSuccess) onSuccess();
            });

            client.on('error', (err) => {
                status.innerText = "Błąd połączenia: " + err;
            });

            client.on('offline', () => {
                status.innerText = "Rozłączono (Offline). Brak sieci.";
            });
        }

        // TRYB TELEFON (NADAJNIK)
        function startPhoneMode() {
            const roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return alert("Wpisz ID Pokoju!");

            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            connectMQTT(() => {
                const topic = "osm_gps_tracker/" + roomId;

                if ('geolocation' in navigator) {
                    navigator.geolocation.watchPosition(
                        (position) => {
                            const data = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            
                            // Wysyłanie współrzędnych do serwera
                            client.publish(topic, JSON.stringify(data));
                            
                            document.getElementById('status').innerText = 
                                `Wysyłanie pozycji: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                            
                            updateMarker(data.lat, data.lng);
                        },
                        (err) => {
                            alert("Błąd GPS: " + err.message);
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                } else {
                    alert("Brak obsługi GPS w przeglądarce.");
                }
            });
        }

        // TRYB PC (ODBIORNIK)
        function startPCMode() {
            const roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return alert("Wpisz ID Pokoju!");

            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            connectMQTT(() => {
                const topic = "osm_gps_tracker/" + roomId;
                
                // Subskrypcja kanału o podanym ID Pokoju
                client.subscribe(topic, (err) => {
                    if (!err) {
                        document.getElementById('status').innerText = "Oczekiwanie na sygnał z telefonu (Pokój: " + roomId + ")...";
                    }
                });

                // Odbieranie danych
                client.on('message', (receivedTopic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if (data.lat && data.lng) {
                            updateMarker(data.lat, data.lng);
                            document.getElementById('status').innerText = 
                                `Odebrano pozycję: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                        }
                    } catch (e) {
                        console.error("Błąd parsowania danych", e);
                    }
                });
            });
        }

        // Aktualizacja znacznika i widoku mapy
        function updateMarker(lat, lng) {
            if (!marker) {
                marker = L.marker([lat, lng]).addTo(map);
                map.setView([lat, lng], 16);
            } else {
                marker.setLatLng([lat, lng]);
                map.panTo([lat, lng]);
            }
        }
    </script>
</body>
</html>
