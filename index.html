<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalizator ZERO BUS</title>

    <!-- Biblioteka Leaflet (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Biblioteka MQTT do transferu danych -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 10px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #7f8c8d; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        #status { font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

    <div id="controls">
        <label for="roomId">ID Trasy:</label>
        <input type="text" id="roomId" value="trasa-321-ZERO">
        
        <button id="btnPhone" onclick="startPhoneMode()">Uruchom jako NADAJNIK (Telefon)</button>
        <button id="btnPC" onclick="startPCMode()">Uruchom jako ODBIORNIK (PC)</button>
        
        <span id="status">Wybierz tryb pracy.</span>
    </div>

    <div id="map"></div>

    <script>
        let map, marker;
        let client;
        let wakeLock = null;

        // Inicjalizacja mapy - styl Wikimedia (Jasny, czytelny, bez ograniczeń API)
        function initMap() {
            map = L.map('map').setView([52.2297, 21.0122], 6);

            L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="https://wikimediafoundation.org/wiki/Maps_Terms_of_Use">Wikimedia maps</a> | © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
        }

        initMap();

        // Tworzenie ikony autobusu dla odbiornika
        const busIcon = L.icon({
            iconUrl: 'bus_ico.png',
            iconSize: [40, 40],   // Domyślny rozmiar ikony (szerokość, wysokość)
            iconAnchor: [20, 20], // Punkt zakotwiczenia środka ikony na współrzędnych
            popupAnchor: [0, -20]
        });

        // Zapobieganie usypianiu przeglądarki w tle
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock error: " + err.message);
            }
        }

        // Połączenie z brokerem MQTT przez WebSockets
        function connectMQTT(onSuccess) {
            const status = document.getElementById('status');
            status.innerText = "Łączenie z serwerem...";

            const clientId = 'osm_user_' + Math.random().toString(16).substr(2, 8);
            
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: clientId,
                keepalive: 30
            });

            client.on('connect', () => {
                status.innerText = "Połączono ze stabilnym serwerem!";
                if (onSuccess) onSuccess();
            });

            client.on('error', (err) => {
                status.innerText = "Błąd połączenia: " + err;
            });

            client.on('offline', () => {
                status.innerText = "Rozłączono (Offline). Brak sieci.";
            });
        }

        // Funkcja do pobierania i wysyłania GPS
        function sendLocation(topic) {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const data = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        
                        client.publish(topic, JSON.stringify(data));
                        
                        document.getElementById('status').innerText = 
                            `Wysyłanie pozycji (co 10s): ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                        
                        updateMarker(data.lat, data.lng, false);
                    },
                    (err) => {
                        console.error("Błąd GPS: " + err.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 9000 }
                );
            } else {
                alert("Brak obsługi GPS w przeglądarce.");
            }
        }

        // TRYB TELEFON (NADAJNIK)
        function startPhoneMode() {
            const roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return alert("Wpisz ID Trasy!");

            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            requestWakeLock();

            connectMQTT(() => {
                const topic = "osm_gps_tracker/" + roomId;

                // Pierwsze wysłanie natychmiast po połączeniu
                sendLocation(topic);

                // Rejestracja cyklicznego wysyłania co 10 sekund (10000 ms)
                setInterval(() => {
                    sendLocation(topic);
                }, 10000);
            });
        }

        // TRYB PC (ODBIORNIK)
        function startPCMode() {
            const roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return alert("Wpisz ID Trasy!");

            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            connectMQTT(() => {
                const topic = "osm_gps_tracker/" + roomId;
                
                client.subscribe(topic, (err) => {
                    if (!err) {
                        document.getElementById('status').innerText = "Oczekiwanie na sygnał (Trasa: " + roomId + ")...";
                    }
                });

                client.on('message', (receivedTopic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if (data.lat && data.lng) {
                            updateMarker(data.lat, data.lng, true);
                            document.getElementById('status').innerText = 
                                `Odebrano pozycję: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                        }
                    } catch (e) {
                        console.error("Błąd parsowania danych", e);
                    }
                });
            });
        }

        // Aktualizacja znacznika na mapie
        function updateMarker(lat, lng, isBusIcon) {
            const options = isBusIcon ? { icon: busIcon } : {};

            if (!marker) {
                marker = L.marker([lat, lng], options).addTo(map);
                map.setView([lat, lng], 16);
            } else {
                marker.setLatLng([lat, lng]);
                if (isBusIcon) {
                    marker.setIcon(busIcon);
                }
                map.panTo([lat, lng]);
            }
        }
    </script>
</body>
</html>
