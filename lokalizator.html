<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalizator OSM</title>

    <!-- Biblioteka Leaflet (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 10px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #7f8c8d; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        #status { font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="controls">
        <label for="roomId">ID Pokoju:</label>
        <input type="text" id="roomId" value="moja-trasa-123">
        
        <button id="btnPhone" onclick="startPhoneMode()">Uruchom jako NADAJNIK (Telefon)</button>
        <button id="btnPC" onclick="startPCMode()">Uruchom jako ODBIORNIK (PC)</button>
        
        <span id="status">Wybierz tryb pracy.</span>
    </div>

    <div id="map"></div>

    <script>
        let map, marker;
        let ws;
        let watchId = null;

        // Inicjalizacja mapy OpenStreetMap
        function initMap() {
            map = L.map('map').setView([52.2297, 21.0122], 6); // Domyślnie Polska

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
        }

        initMap();

        // Połączenie z WebSocketem (używamy darmowej publicznej instancji demo)
        function connectWebSocket(roomId, onOpenCallback) {
            const status = document.getElementById('status');
            status.innerText = "Łączenie z serwerem...";

            // Darmowy publiczny serwer testowy
            ws = new WebSocket(`wss://demo.piesocket.com/v3/${roomId}?api_key=VCX2aCTopicZWCwfkFZ1KuMu7BkgptAXxGiyGq26&notify_self`);

            ws.onopen = () => {
                status.innerText = "Połączono! Pokój: " + roomId;
                if (onOpenCallback) onOpenCallback();
            };

            ws.onerror = () => { status.innerText = "Błąd połączenia z serwerem."; };
            ws.onclose = () => { status.innerText = "Rozłączono."; };
        }

        // TRYB TELEFON (NADAJNIK)
        function startPhoneMode() {
            const roomId = document.getElementById('roomId').value;
            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            connectWebSocket(roomId, () => {
                if ('geolocation' in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const data = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                speed: position.coords.speed
                            };
                            
                            // Wysyłanie współrzędnych przez WebSocket
                            ws.send(JSON.stringify(data));
                            
                            document.getElementById('status').innerText = 
                                `Wysyłanie pozycji: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                            
                            // Aktualizacja mapy na telefonie
                            updateMarker(data.lat, data.lng);
                        },
                        (err) => {
                            alert("Błąd GPS: " + err.message);
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                } else {
                    alert("Twoja przeglądarka nie obsługuje geolokalizacji.");
                }
            });
        }

        // TRYB PC (ODBIORNIK)
        function startPCMode() {
            const roomId = document.getElementById('roomId').value;
            document.getElementById('btnPhone').disabled = true;
            document.getElementById('btnPC').disabled = true;

            connectWebSocket(roomId, () => {
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.lat && data.lng) {
                            updateMarker(data.lat, data.lng);
                            document.getElementById('status').innerText = 
                                `Odebrano pozycję: ${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;
                        }
                    } catch (e) {
                        console.log("Odebrano niepoprawne dane", event.data);
                    }
                };
            });
        }

        // Aktualizacja znacznika na mapie
        function updateMarker(lat, lng) {
            if (!marker) {
                marker = L.marker([lat, lng]).addTo(map);
                map.setView([lat, lng], 16);
            } else {
                marker.setLatLng([lat, lng]);
                map.panTo([lat, lng]);
            }
        }
    </script>
</body>
</html>
